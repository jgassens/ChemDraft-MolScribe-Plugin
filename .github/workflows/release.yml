name: Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run package
      # The .sha256 sidecar names the zip by its bare filename, so check from beside it.
      - run: sha256sum --check molscribe-ocsr-*.zip.sha256
        working-directory: dist/plugin-packages
      - run: unzip -t molscribe-ocsr-*.zip
        working-directory: dist/plugin-packages
      - uses: actions/upload-artifact@v4
        with:
          name: molscribe-ocsr-package
          path: dist/plugin-packages/molscribe-ocsr-*.zip*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: molscribe-ocsr-package
          path: dist/plugin-packages
      - run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/plugin-packages/molscribe-ocsr-*.zip
          dist/plugin-packages/molscribe-ocsr-*.zip.sha256
          --generate-notes
          --title "Structure from Image (MolScribe) $GITHUB_REF_NAME"
          --verify-tag
          --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
